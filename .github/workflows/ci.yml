# ============================================================
# CI — Two-Tier Test Strategy
# ============================================================
#
# Job 1: test (fast, every push/PR)
#   Runs 127 non-Spark unit tests via make test-ci.
#   No Docker, no Java — just Python + pip.
#   Passes in ~30s on ubuntu-latest.
#
# Job 2: test-docker (full, merge to main only)
#   Runs ALL ~228 tests (Spark + non-Spark) inside Docker
#   via make test-docker. Requires building the pipeline image.
#   Runs on push to main (not PRs) to keep CI fast.
# ============================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ==========================================================
  # Fast: non-Spark unit tests (no Docker, no Java)
  # ==========================================================
  test:
    name: "Non-Spark Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-Spark tests
        run: bash scripts/run_tests.sh --quiet

  # ==========================================================
  # Full: Spark tests inside Docker (push to main only)
  # ==========================================================
  test-docker:
    name: "Full Test Suite (Docker)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pipeline image
        run: docker compose build pipeline

      - name: Run full test suite (Spark + non-Spark)
        run: |
          docker compose run --rm --no-deps pipeline \
            /app/scripts/run_spark_tests.sh --quiet
